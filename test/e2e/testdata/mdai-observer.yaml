apiVersion: hub.mydecisive.ai/v1
kind: MdaiObserver
metadata:
  labels:
    app.kubernetes.io/name: mdai-operator
    app.kubernetes.io/managed-by: kustomize
  name: mdaihub-sample
  namespace: mdai
spec:
  observers:
    - name: observer1
      telemetry_type: logs
      metrics_backend: prometheus
      aggregation_temporality: cumulative
      labelResourceAttributes:
        - service.name
      countMetricName: mdai_observer_one_count_total
      bytesMetricName: mdai_observer_one_bytes_total
    - name: observer2
      telemetry_type: logs
      metrics_backend: prometheus
      aggregation_temporality: cumulative
      labelResourceAttributes:
        - team
        - log_level
      countMetricName: mdai_observer_two_count_total
    - name: observer3
      telemetry_type: logs
      metrics_backend: prometheus
      aggregation_temporality: cumulative
      labelResourceAttributes:
        - region
        - log_level
      bytesMetricName: mdai_observer_three_count_total
    - name: observer4
      telemetry_type: logs
      metrics_backend: greptimedb
      aggregation_temporality: delta
      labelResourceAttributes:
        - service.name
        - team
        - region
      countMetricName: mdai_observer_four_count_total
      bytesMetricName: mdai_observer_four_bytes_total
      filter:
        error_mode: ignore
        logs:
          log_record:
            - 'attributes["log_level"] == "INFO"'
  observerResource:
    image: public.ecr.aws/decisiveai/observer-collector:0.1.7
    replicas: 2
    tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "gpu"
        effect: "NoSchedule"