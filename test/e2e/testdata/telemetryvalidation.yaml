apiVersion: hub.mydecisive.ai/v1
kind: TelemetryValidation
metadata:
  name: gateway-tv
spec:
  enabled: true
  collectorRef:
    name: gateway
  signals:
    - metrics
    - logs
    - traces
  shadowDebugExporterEnabled: false
  validator:
    image: ghcr.io/mydecisive/mdai-fidelity-validator:0.1.2
    port: 18081
    rulesYAML: |
      rules: []
    fieldMappingYAML: |
      mappings: []
