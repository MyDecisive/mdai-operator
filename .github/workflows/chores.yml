name: Chores

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  version-bump-check:
    name: Version Bump Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Check version was bumped
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          CHART_VERSION=$(yq '.version' deployment/Chart.yaml)
          if [ "$CHART_VERSION" = "$LATEST_TAG" ]; then
            echo "Version was not bumped (still $LATEST_TAG). Run 'make release NEW_VERSION=x.y.z' on your branch."
            exit 1
          fi
          echo "Version bumped: $LATEST_TAG → $CHART_VERSION"

  lint-and-test:
    name: Lint & Test on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go mod and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: |
          go mod download

      - name: Check module tidiness
        run: |
          make tidy-check

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: "binary"
          version: v2.11.4

      - name: Running Tests
        run: make test-coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          files: ./coverage.out

  test-e2e:
    name: E2E tests on Ubuntu
    needs: [ lint-and-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go mod and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-
            ${{ runner.os }}-go-

      - name: Set up kind
        uses: helm/kind-action@v1.12.0
        with:
          version: v0.29.0
          wait: 60s
          cluster_name: kind

      - name: Running Test e2e
        run: |
          make test-e2e
