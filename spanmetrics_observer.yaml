- name: watcher_gs_greptime
  provider: greptimeFlow
  type: spanMetrics
  spanMetricsObserver:
    greptime:
      dimensions:
        - service_name
        - span_attributes.server.address
        - resource_attributes.host.name
      primaryKey: service_name

- name: watcher_gs_otel
  provider: otelCollector
  type: spanMetrics
  spanMetricsObserver:
    otel:
      groupByAttrs:
        - some.field
      connectorConfig:
        dimensions:
          - name: host.name
          - name: server.address
