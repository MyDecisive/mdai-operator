apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: other-consumer
  namespace: mdai
  labels:
    mydecisive.ai/hub-name: restart-test
spec:
  envFrom:
    - configMapRef:
        name: restart-test-variables
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      attributes:
        actions:
          - key: rate
            value: "${env:OTHER_RATE}"
            action: insert
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [attributes]
          exporters: [debug]
